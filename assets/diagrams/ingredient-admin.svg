<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
<title>성분 데이터 관리 방식 변경 전후</title><desc>변경 전에는 팀원과 AI 검수가 엑셀과 작업별 JSON 파일을 직접 다루고, 서버가 켜질 때 파일 전체를 검사 없이 읽었다. 변경 후에는 관리자 화면에서 API로 변경을 요청하고, 승인된 변경만 확정 데이터에 반영한 뒤 서비스 스키마 검사를 통과한 묶음만 서비스 DB로 보낸다.</desc>
<rect width="1000" height="700" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58616b"/></marker></defs>
<text x="32" y="32" font-size="14" font-weight="600" text-anchor="start" fill="#26313b">변경 전  파일로 관리</text>
<rect x="32" y="58" width="150" height="62" fill="#ffffff" stroke="#91979f" stroke-width="1.5"/>
<text x="107.0" y="95.0" font-size="16" font-weight="500" text-anchor="middle" fill="#26313b">팀원</text>
<rect x="32" y="150" width="150" height="62" fill="#ffffff" stroke="#91979f" stroke-width="1.5"/>
<text x="107.0" y="187.0" font-size="16" font-weight="500" text-anchor="middle" fill="#26313b">AI 검수</text>
<path d="M182 89H232" fill="none" stroke="#58616b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M182 181H232" fill="none" stroke="#58616b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="232" y="58" width="250" height="62" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="357.0" y="86.0" font-size="16" font-weight="500" text-anchor="middle" fill="#26313b">엑셀 작업 파일</text>
<text x="357.0" y="108.0" font-size="13" font-weight="400" text-anchor="middle" fill="#46515c">프로그램마다 다르게 열림</text>
<rect x="232" y="150" width="250" height="62" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="357.0" y="178.0" font-size="16" font-weight="500" text-anchor="middle" fill="#26313b">작업별 JSON 파일</text>
<text x="357.0" y="200.0" font-size="13" font-weight="400" text-anchor="middle" fill="#46515c">어느 것이 최신인지 모름</text>
<path d="M482 89H532V120H578" fill="none" stroke="#58616b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M482 181H532V150H578" fill="none" stroke="#58616b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="578" y="104" width="300" height="62" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="728.0" y="132.0" font-size="16" font-weight="500" text-anchor="middle" fill="#26313b">서버가 켜질 때 전체 읽기</text>
<text x="728.0" y="154.0" font-size="13" font-weight="400" text-anchor="middle" fill="#46515c">미리 검사하지 않음</text>
<text x="32" y="252" font-size="14" font-weight="400" text-anchor="start" fill="#26313b">지금 확정된 값이 무엇인지 한곳에서 볼 수 없었음</text>
<text x="32" y="276" font-size="14" font-weight="400" text-anchor="start" fill="#26313b">데이터 파일만 바꿨는데 서버가 켜지지 않는 일이 생김</text>
<path d="M32 306H968" stroke="#e0e3e6"/>
<text x="32" y="344" font-size="14" font-weight="600" text-anchor="start" fill="#26313b">변경 후  DB와 관리자 화면으로 관리</text>
<rect x="32" y="366" width="150" height="62" fill="#ffffff" stroke="#91979f" stroke-width="1.5"/>
<text x="107.0" y="403.0" font-size="16" font-weight="500" text-anchor="middle" fill="#26313b">팀원</text>
<path d="M182 397H222" fill="none" stroke="#58616b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="222" y="366" width="230" height="62" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="337.0" y="394.0" font-size="16" font-weight="500" text-anchor="middle" fill="#26313b">관리자 화면</text>
<text x="337.0" y="416.0" font-size="13" font-weight="400" text-anchor="middle" fill="#46515c">검색, 상태, 변경 기록</text>
<path d="M452 397H492" fill="none" stroke="#58616b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="492" y="366" width="250" height="62" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="617.0" y="394.0" font-size="16" font-weight="500" text-anchor="middle" fill="#26313b">변경 요청 API</text>
<text x="617.0" y="416.0" font-size="13" font-weight="400" text-anchor="middle" fill="#46515c">누가, 왜 바꿨는지 기록</text>
<path d="M742 397H782" fill="none" stroke="#58616b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="782" y="366" width="186" height="62" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="875.0" y="394.0" font-size="16" font-weight="500" text-anchor="middle" fill="#26313b">요청 거절</text>
<text x="875.0" y="416.0" font-size="13" font-weight="400" text-anchor="middle" fill="#46515c">설정 버전이 다를 때</text>
<path d="M617 428V450H337V470" fill="none" stroke="#58616b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M617 428V470" fill="none" stroke="#58616b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="222" y="470" width="230" height="62" fill="#ffffff" stroke="#91979f" stroke-width="1.5"/>
<text x="337.0" y="498.0" font-size="16" font-weight="500" text-anchor="middle" fill="#26313b">작업 상태 DB</text>
<text x="337.0" y="520.0" font-size="13" font-weight="400" text-anchor="middle" fill="#46515c">작업 순서, 재시도, 호출 기록</text>
<rect x="492" y="470" width="250" height="62" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="617.0" y="498.0" font-size="16" font-weight="500" text-anchor="middle" fill="#26313b">확정 데이터 DB</text>
<text x="617.0" y="520.0" font-size="13" font-weight="400" text-anchor="middle" fill="#46515c">승인된 변경만 반영</text>
<path d="M617 532V574" fill="none" stroke="#58616b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="492" y="574" width="250" height="62" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="617.0" y="602.0" font-size="16" font-weight="500" text-anchor="middle" fill="#26313b">배포용 데이터 묶음</text>
<text x="617.0" y="624.0" font-size="13" font-weight="400" text-anchor="middle" fill="#46515c">서비스 스키마 검사 통과</text>
<path d="M742 605H782" fill="none" stroke="#58616b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="782" y="574" width="186" height="62" fill="#ffffff" stroke="#91979f" stroke-width="1.5"/>
<text x="875.0" y="611.0" font-size="16" font-weight="500" text-anchor="middle" fill="#26313b">서비스 DB</text>
<text x="32" y="494" font-size="14" font-weight="600" text-anchor="start" fill="#26313b">화면에서 DB를 바로 고치지 않음</text>
<text x="32" y="518" font-size="13" font-weight="400" text-anchor="start" fill="#26313b">변경은 API 요청으로만 하고</text>
<text x="32" y="540" font-size="13" font-weight="400" text-anchor="start" fill="#26313b">같은 요청은 한 번만 반영</text>
</svg>
