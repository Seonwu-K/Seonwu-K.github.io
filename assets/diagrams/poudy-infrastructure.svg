<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
<title>Poudy 배포와 데이터 복구 경로</title><desc>웹과 Android 앱 요청을 Nginx가 Next.js와 Spring Boot로 전달한다. CodeDeploy가 두 EC2를 배포하고 S3 데이터는 검증 후 반영하며 실패 시 롤백한다.</desc>
<rect width="1000" height="650" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58616b"/></marker></defs>
<text x="32" y="32" font-size="14" font-weight="600" text-anchor="start" fill="#26313b">01  요청 흐름</text>
<rect x="240" y="52" width="266" height="275" fill="#fafbfc" stroke="#aeb4ba" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="256" y="79" font-size="14" font-weight="600" text-anchor="start" fill="#26313b">프론트 EC2</text>
<rect x="652" y="52" width="316" height="275" fill="#fafbfc" stroke="#aeb4ba" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="668" y="79" font-size="14" font-weight="600" text-anchor="start" fill="#26313b">백엔드 EC2</text>
<rect x="32" y="106" width="156" height="58" fill="#ffffff" stroke="#91979f" stroke-width="1.5"/>
<text x="110.0" y="141.0" font-size="16" font-weight="500" text-anchor="middle" fill="#26313b">웹 브라우저</text>
<rect x="32" y="207" width="156" height="64" fill="#ffffff" stroke="#91979f" stroke-width="1.5"/>
<text x="110.0" y="236.0" font-size="16" font-weight="500" text-anchor="middle" fill="#26313b">Android 앱</text>
<text x="110.0" y="258.0" font-size="13" font-weight="400" text-anchor="middle" fill="#46515c">WebView</text>
<path d="M188 135H215V139H262" fill="none" stroke="#58616b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M188 239H215V139H262" fill="none" stroke="#58616b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="262" y="106" width="222" height="66" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="373.0" y="136.0" font-size="16" font-weight="500" text-anchor="middle" fill="#26313b">Nginx :443</text>
<text x="373.0" y="158.0" font-size="13" font-weight="400" text-anchor="middle" fill="#46515c">HTTPS 진입점</text>
<path d="M373 172V235" fill="none" stroke="#58616b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="262" y="235" width="222" height="66" fill="#ffffff" stroke="#91979f" stroke-width="1.5"/>
<text x="373.0" y="265.0" font-size="16" font-weight="500" text-anchor="middle" fill="#26313b">Next.js standalone</text>
<text x="373.0" y="287.0" font-size="13" font-weight="400" text-anchor="middle" fill="#46515c">:3000 / systemd</text>
<path d="M484 139H674" fill="none" stroke="#58616b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="579" y="122" font-size="14" font-weight="400" text-anchor="middle" fill="#26313b">/api/*</text>
<text x="579" y="163" font-size="13" font-weight="400" text-anchor="middle" fill="#58616b">사설 IP</text>
<rect x="674" y="106" width="272" height="66" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="810.0" y="136.0" font-size="16" font-weight="500" text-anchor="middle" fill="#26313b">Spring Boot :8080</text>
<text x="810.0" y="158.0" font-size="13" font-weight="400" text-anchor="middle" fill="#46515c">systemd 자동 재시작</text>
<rect x="674" y="235" width="272" height="66" fill="#ffffff" stroke="#91979f" stroke-width="1.5"/>
<text x="810.0" y="265.0" font-size="16" font-weight="500" text-anchor="middle" fill="#26313b">런타임 JSON</text>
<text x="810.0" y="287.0" font-size="13" font-weight="400" text-anchor="middle" fill="#46515c">/opt/poudy/data</text>
