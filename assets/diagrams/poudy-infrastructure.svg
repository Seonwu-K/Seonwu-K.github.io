<rect x="227" y="416" width="215" height="66" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="334.5" y="446.0" font-size="16" font-weight="500" text-anchor="middle" fill="#26313b">CodeDeploy</text>
<text x="334.5" y="468.0" font-size="13" font-weight="400" text-anchor="middle" fill="#46515c">배포 훅 / health 검증</text>
<path d="M335 416V327" fill="none" stroke="#58616b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<path d="M442 449H570V311H652" fill="none" stroke="#58616b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="32" y="516" font-size="14" font-weight="400" text-anchor="start" fill="#26313b">기동 후 health를 확인하고 릴리즈</text>
<text x="652" y="394" font-size="14" font-weight="600" text-anchor="start" fill="#26313b">03  데이터 동기화</text>
<rect x="652" y="416" width="110" height="66" fill="#ffffff" stroke="#91979f" stroke-width="1.5"/>
<text x="707.0" y="446.0" font-size="16" font-weight="500" text-anchor="middle" fill="#26313b">S3</text>
<text x="707.0" y="468.0" font-size="13" font-weight="400" text-anchor="middle" fill="#46515c">원본 JSON</text>
<path d="M762 449H801" fill="none" stroke="#58616b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="801" y="416" width="167" height="66" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="884.5" y="446.0" font-size="16" font-weight="500" text-anchor="middle" fill="#26313b">data-sync timer</text>
<text x="884.5" y="468.0" font-size="13" font-weight="400" text-anchor="middle" fill="#46515c">약 5분 주기</text>
<path d="M884 416V301" fill="none" stroke="#58616b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="652" y="516" font-size="14" font-weight="400" text-anchor="start" fill="#26313b">구조 검증 → 데이터 교체 → 재시작</text>
<text x="652" y="541" font-size="14" font-weight="600" text-anchor="start" fill="#26313b">health 실패 시 이전 데이터로 복구</text>
<path d="M32 572H968" stroke="#e0e3e6"/>
<text x="32" y="610" font-size="14" font-weight="600" text-anchor="start" fill="#26313b">운영 관측</text>
<text x="156" y="610" font-size="14" font-weight="400" text-anchor="start" fill="#26313b">journald  /  CloudWatch Agent  /  Grafana HTTPS 체크</text>
